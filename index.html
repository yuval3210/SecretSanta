<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>✨ Secret Santa Extravaganza ✨</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #0f3460 50%, #16213e 100%);
            background-attachment: fixed;
            min-height: 100%;
            height: auto;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }

        /* Fallback for mobile Safari */
        @supports (-webkit-touch-callout: none) {
            body {
                min-height: -webkit-fill-available;
            }
        }

        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 1em;
            opacity: 0.8;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            animation: fadeInDown 1s ease-out;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #ffd700, #ff6b6b, #4ecdc4, #ffd700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite, glow 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        .header p {
            color: #ffd700;
            font-size: 1.2em;
            font-style: italic;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 8px 32px 0 rgba(255, 215, 0, 0.2);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .mode-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            border-color: #ffd700;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .mode-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        input, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        button {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .participant-list {
            margin-top: 20px;
        }

        .participant-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .participant-name {
            color: white;
            font-size: 1.2em;
            font-weight: bold;
        }

        .delete-btn {
            background: linear-gradient(135deg, #ff6b6b, #c92a2a);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            width: auto;
            margin: 0;
        }

        .reveal-container {
            text-align: center;
            padding: 40px 20px;
        }

        .gift-box {
            font-size: 100px;
            margin: 30px 0;
            animation: bounce 2s infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gift-box:hover {
            transform: scale(1.1) rotate(5deg);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .reveal-text {
            color: white;
            font-size: 1.5em;
            margin: 20px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .assignment {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            animation: celebration 0.6s ease-out;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }

        @keyframes celebration {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .assignment h2 {
            font-size: 2em;
            color: white;
            margin-bottom: 20px;
        }

        .assignment-name {
            font-size: 3em;
            color: #1a0a2e;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
        }

        .info-text {
            color: #ffd700;
            font-size: 0.9em;
            margin-top: 10px;
            font-style: italic;
        }

        .shuffle-btn {
            background: linear-gradient(135deg, #4ecdc4, #2193b0);
            margin-top: 20px;
        }

        .error {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success {
            background: rgba(78, 205, 196, 0.2);
            border: 2px solid #4ecdc4;
            color: #4ecdc4;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 3s linear;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .hidden {
            display: none;
        }

        .forced-assignments {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 215, 0, 0.3);
        }

        .forced-pair {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            background: rgba(255, 215, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .forced-pair select {
            flex: 1;
            margin: 0;
        }

        .arrow {
            color: #ffd700;
            font-size: 1.5em;
            font-weight: bold;
        }

        .remove-forced-btn {
            background: linear-gradient(135deg, #ff6b6b, #c92a2a);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            width: auto;
            margin: 0;
        }

        .section-title {
            color: white;
            font-size: 1.3em;
            margin: 20px 0 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="snowflakes"></div>
    
    <div class="container">
        <div class="header">
            <h1>🎁 Secret Santa 🎅</h1>
            <p>Where magic happens!</p>
        </div>

        <div class="card">

            <!-- Participant Mode -->
            <div id="participant-mode">
                <h2 style="color: white; text-align: center; margin-bottom: 20px;">
                    Who Are You?
                </h2>
                <select 
                    id="participant-name"
                    onchange="if(this.value) findAssignment()"
                >
                    <option value="">Choose your name...</option>
                </select>
                <div id="participant-result"></div>
            </div>
        </div>
    </div>

    <script>
        // Data loaded from file
        let participantIds = {};
        let idToName = {};
        let assignments = {};
        let participantNames = [];

        // Load data from JSON file
        async function loadData() {
            try {
                // Add timestamp to prevent caching
                const cacheBuster = new Date().getTime();
                const response = await fetch(`data.json?v=${cacheBuster}`);
                const data = await response.json();
                
                participantIds = data.participants;
                idToName = data.participants;
                
                // Decode assignments
                assignments = {};
                for (let giverId in data.assignments) {
                    const giverName = participantIds[giverId];
                    const receiverId = data.assignments[giverId];
                    const receiverName = participantIds[receiverId];
                    assignments[giverName] = receiverName;
                }
                
                participantNames = Object.values(participantIds);
                updateParticipantDropdown();
            } catch (error) {
                console.error('Error loading data:', error);
                alert('⚠️ Could not load Secret Santa data. Make sure data.json is in the same folder!');
            }
        }

        // Create snowflakes
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = '❄';
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
                container.appendChild(snowflake);
            }
        }

        function updateParticipantDropdown() {
            const select = document.getElementById('participant-name');
            select.innerHTML = '<option value="">Choose your name...</option>';
            
            participantNames.sort().forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
        }

        function findAssignment() {
            const select = document.getElementById('participant-name');
            const name = select.value;
            const resultDiv = document.getElementById('participant-result');
            
            if (!name) {
                resultDiv.innerHTML = '<div class="error">Please choose your name!</div>';
                return;
            }
            
            if (!assignments[name]) {
                resultDiv.innerHTML = '<div class="error">Assignments haven\'t been made yet!</div>';
                return;
            }
            
            // Fun reveal animation
            resultDiv.innerHTML = `
                <div class="reveal-container">
                    <div class="gift-box" onclick="revealAssignment('${name}')">🎁</div>
                    <div class="reveal-text">Click the gift to reveal!</div>
                </div>
            `;
        }

        function revealAssignment(giver) {
            const receiver = assignments[giver];
            const resultDiv = document.getElementById('participant-result');
            
            createConfetti();
            
            resultDiv.innerHTML = `
                <div class="assignment">
                    <h2>You're giving a gift to:</h2>
                    <div class="assignment-name">🎅 ${receiver} 🎄</div>
                </div>
                <button onclick="clearAssignment()" style="background: linear-gradient(135deg, #4ecdc4, #2193b0);">
                    Clear & Check Again
                </button>
            `;
        }

        function clearAssignment() {
            document.getElementById('participant-name').value = '';
            document.getElementById('participant-result').innerHTML = '';
        }

        function createConfetti() {
            const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#95e1d3', '#f38181'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // Initialize
        loadData();
        createSnowflakes();
    </script>
</body>
</html>
